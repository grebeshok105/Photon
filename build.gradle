plugins {
    id 'fabric-loom' version '1.16.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

loom {
    accessWidenerPath = file("src/main/resources/photon.accesswidener")
}

repositories {
    // aliyun first: this box gets rate-limited (429) by Maven Central
    maven { url = 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
    mavenLocal()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://cursemaven.com"
    }
    maven { url = "https://jitpack.io/" } // Mixin Extras, Fabric ASM
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Fabric toolchain
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Required by ldlib2 (fabric-language-kotlin is a hard dependency in ldlib2's fabric.mod.json)
    modRuntimeOnly "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}"

    // Vendored fabric ports (grebeshok105/LDLib2 + grebeshok105/KilaGraph, fabric-1.21.1 branches)
    modImplementation files('libs/ldlib2-fabric-1.21.1-2.4.jar')
    modImplementation files('libs/kilagraph-fabric-1.21.1-21.1.0.15-fabric.jar')

    // kilagraph's fluid nodes build against the architectury FluidStack API
    modImplementation "curse.maven:architectury-api-419699:5786326"

    // taffy + yoga are used directly by photon sources; they ship nested inside the
    // ldlib2 jar (META-INF/jars) so no include() needed — compile dep only.
    implementation "dev.vfyjxf:taffy:${taffy_version}"
    implementation "org.appliedenergistics.yoga:yoga:${yoga_version}"

    // Forge Config API Port: net.neoforged.neoforge.common.ModConfigSpec on fabric
    modImplementation "maven.modrinth:forge-config-api-port:${project.forge_config_api_port_version}"
    // nightconfig backs ModConfigSpec; forgeconfigapiport nests it but loom's dev classpath
    // does not surface nested jars, so put it on the classpath directly (same version).
    implementation "com.electronwill.night-config:core:3.8.0"
    implementation "com.electronwill.night-config:toml:3.8.0"

    // Iris & Sodium for shader pass compatibility
    modCompileOnly "maven.modrinth:iris:${project.iris_version}"
    modCompileOnly "maven.modrinth:sodium:${project.sodium_version}"

    // Annotations
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testCompileOnly 'com.google.code.findbugs:jsr305:3.0.2'


    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Unit tests (JUnit 5). Only for MC-free logic such as the Timeline evaluation core.
    testImplementation platform("org.junit:junit-bom:5.11.3")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "mod_id": project.mod_id,
                "mod_name": project.mod_name,
                "mod_description": project.mod_description,
                "mod_url": project.mod_url,
                "mod_license": project.mod_license,
                "ldlib2_version_range": project.ldlib2_version_range,
                "kilagraph_version_range": project.kilagraph_version_range
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    // upstream bundles KilaGraph inside the photon jar (jarJar); loom's include() does not
    // accept file deps, so nest it under META-INF/jars directly — same jar-in-jar semantics.
    from(zipTree('libs/kilagraph-fabric-1.21.1-21.1.0.15-fabric.jar')) {
        into 'META-INF/jars'
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
