# Gradle
org.gradle.jvmargs=-Xmx6G
org.gradle.daemon=false
org.gradle.debug=false

# Mod Info
mod_id=photon
mod_name=Photon
mod_version=2.2.7
mod_description=Photon, a VFX library
mod_license=GPL-3.0 license
mod_url=https://github.com/Low-Drag-MC/Photon/
maven_group=com.lowdragmc.photon
archives_base_name=photon

# Fabric toolchain — https://modmuss50.me/fabric.html
minecraft_version=1.21.1
loader_version=0.18.2
fabric_version=0.116.9+1.21.1
# fabric-language-kotlin is a hard dependency of ldlib2's fabric build
fabric_language_kotlin_version=1.12.3+kotlin.2.0.21

# Dependency ranges (fabric.mod.json); the jars themselves are vendored in libs/
ldlib2_version_range=[2.7,)
kilagraph_version_range=[21.1.0.15,)

# Iris & Sodium (fabric builds — neoforge variants do not exist on fabric)
# https://modrinth.com/mod/iris / https://modrinth.com/mod/sodium
iris_version=1.8.8+1.21.1-fabric
sodium_version=mc1.21.1-0.8.13-fabric

# Forge Config API Port — provides net.neoforged.neoforge.common.ModConfigSpec on fabric
# https://modrinth.com/mod/forge-config-api-port
forge_config_api_port_version=v21.1.6-1.21.1-Fabric
taffy_version=1.1.4
yoga_version=1.0.0
